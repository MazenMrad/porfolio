<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazen — Godot Game Programmer</title>
    <meta name="description" content="Godot game programmer (Mazicore). I write the systems you feel in play. Start with Obsidio: tower defense that rewards aim, not placement." />
    <!-- Chakra Petch: angular game-UI display. IBM Plex: technical body + metadata. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#070a16" />
    <script>
      try {
        var theme = localStorage.getItem('mazicore-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f8fb' : '#070a16');
        }
      } catch (e) {}
    </script>
</head>
  <body>
    <noscript>
      <style>
        /* Scroll-reveal is driven by an IntersectionObserver. Without JS it
           never fires, so the prerendered content would stay at opacity 0. */
        .dx-reveal, .fade-in { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
