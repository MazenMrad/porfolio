<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mazen — Unity & Godot Game Programmer</title>
    <meta name="description" content="Freelance gameplay programmer (Mazicore) working in Unity and Godot. I write the systems you feel in play." />
    <!-- Archivo for headings, Atkinson Hyperlegible Next for reading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600..900&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#f7f7f5" />
    <script>
      try {
        var theme = localStorage.getItem('mazicore-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f5' : '#161616');
        }
      } catch (e) {}
    </script>
</head>
  <body>
    <noscript>
      <style>
        /* Scroll-reveal is driven by an IntersectionObserver. Without JS it
           never fires, so the prerendered content would stay at opacity 0. */
        .dx-reveal, .fade-in { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
